# PhysicsNeMo 2.2.2 / Level 2: AFNO
# Periodic reaction-diffusion: u - Laplacian(u) = f, [0,1)^2.
# Plain YAML loaded by the explicit PyTorch loop; no Hydra defaults.
data:
  grid_size: 64
model:
  patch_size: [8, 8]
  embed_dim: 256
  depth: 4
  num_blocks: 8
  mlp_ratio: 4.0
training:
  steps: 3000
  batch_size: 32
  learning_rate: 0.001
  cpu_threads: 2
