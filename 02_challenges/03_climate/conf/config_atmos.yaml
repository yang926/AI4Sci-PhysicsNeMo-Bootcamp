# PhysicsNeMo 2.2.2 explicit-loop config; no Hydra defaults.
training:
  steps: 40000
  learning_rate: 0.001
model:
  width: 64
  layers: 3
samples:
  interior: 128
  initial: 64
  boundary: 64
physics:
  u0: 0.0
  v0: 0.0
  kappa: 1.0
  lam: 0.0
  Q0: 0.0
  Teq: 0.0
