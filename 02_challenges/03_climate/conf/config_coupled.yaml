# PhysicsNeMo 2.2.2 explicit-loop config; no Hydra defaults.
training:
  steps: 10000
  learning_rate: 0.001
model:
  width: 64
  layers: 3
samples:
  interior: 128
  initial: 64
  boundary: 64
physics:
  u0: 0.0
  v0: 0.0
  kappa_a: 1.0
  kappa_o: 0.5
  lam_a: 0.0
  Q_a0: 0.0
  Q_o0: 0.0
  Teq_a0: 0.0
  # Positive exchange couples the two fields; use 0.0 for the uncoupled comparison.
  gamma0: 0.0
