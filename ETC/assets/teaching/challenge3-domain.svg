<title id="title">Challenge 3 · One square, time, and two temperature fields</title>
<desc id="desc">Interior and boundary samples occupy the same square from zero to pi. Initial samples use t zero; PDE and boundary samples span zero to two pi. Level one predicts T, level two predicts Ta and To with zero heat exchange in the default baseline.</desc>
