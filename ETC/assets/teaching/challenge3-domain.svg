<title id="title">챌린지 3 · 정사각형, 시간, 두 온도장</title>
<desc id="desc">내부와 경계 표본은 0부터 pi인 같은 정사각형에 놓입니다. 초기 표본은 t=0을 사용하고 PDE 및 경계 표본은 0부터 2pi까지의 시간에 걸쳐 분포합니다. 레벨 1은 T를, 레벨 2는 Ta와 To를 예측하며 기본 기준 설정의 열 교환은 0입니다.</desc>
