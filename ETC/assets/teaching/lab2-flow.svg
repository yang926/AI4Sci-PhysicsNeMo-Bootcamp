<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="930" viewBox="0 0 1200 930" role="img" aria-labelledby="title desc">
<title id="title">실습 2 · 운동을 학습 신호로 바꾸는 과정</title><desc id="desc">시간을 PhysicsNeMo FullyConnected 신경망을 사용하는 ProjectileModel에 입력합니다. PyTorch autograd가 2차 시간 도함수를 PhysicsInformer에 제공하고, PhysicsInformer는 기호로 정의한 ProjectileEquation 잔차를 계산합니다. 초기 위치와 속도 손실은 시간 0에서 별도로 계산합니다. 코사인 학습률 스케줄을 사용하는 Adam이 가중치를 갱신합니다. 해석적 운동은 학습 후 평가에 사용합니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526573"/></marker></defs><rect width="1200" height="930" fill="#ffffff"/><g font-family="DejaVu Sans, Arial, Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<text x="38" y="48" font-size="30" fill="#172c3c" font-weight="600" text-anchor="start">실습 2 · 운동을 학습 신호로 바꾸는 과정</text><text x="38" y="85" font-size="19" fill="#526573" font-weight="400" text-anchor="start">코드 연결도 · 학습 결과가 아닌 개략도</text>
<rect x="38" y="116" width="245" height="173" rx="14" fill="#eef5fb" stroke="#2269a8" stroke-width="2"/>
<text x="60" y="152" font-size="24" fill="#2269a8" font-weight="600" text-anchor="start">시간 샘플링</text>
<text x="60" y="189" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">loss_terms():</text>
<text x="60" y="218" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">t ∈ [0, 5] s</text>
<text x="60" y="247" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">초기 조건 검사: t = 0</text>
<rect x="334" y="116" width="434" height="173" rx="14" fill="#edf8f5" stroke="#147d72" stroke-width="2"/>
<text x="356" y="152" font-size="24" fill="#147d72" font-weight="600" text-anchor="start">ProjectileModel.forward</text>
<text x="356" y="189" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">정규화 시간 → mlp(1, 2)</text>
<text x="356" y="218" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">PhysicsNeMo FullyConnected</text>
<text x="356" y="247" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">→ 물리적 위치 (x, y)</text>
<rect x="820" y="116" width="342" height="173" rx="14" fill="#f5f1fb" stroke="#7658a3" stroke-width="2"/>
<text x="842" y="152" font-size="24" fill="#7658a3" font-weight="600" text-anchor="start">PyTorch derivative()</text>
<text x="842" y="189" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">t에 대한 자동 미분.</text>
<text x="842" y="218" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">x_tt와 y_tt를</text>
<text x="842" y="247" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">PhysicsInformer에 전달.</text>
<path d="M 283 205 H 334" fill="none" stroke="#526573" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 768 205 H 820" fill="none" stroke="#526573" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="38" y="351" width="427" height="174" rx="14" fill="#fff5e9" stroke="#bd6416" stroke-width="2"/>
<text x="60" y="387" font-size="24" fill="#bd6416" font-weight="600" text-anchor="start">ProjectileEquation(PDE)</text>
<text x="60" y="424" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">self.equations에 ode_x, ode_y 저장.</text>
<text x="60" y="453" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">기호로 표현한 식이며</text>
<text x="60" y="482" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">추가 신경망이 아님.</text>
<text x="60" y="511" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">projectile_eqn.py에서 정의.</text>
<rect x="525" y="351" width="637" height="174" rx="14" fill="#edf8f5" stroke="#147d72" stroke-width="2"/>
<text x="547" y="387" font-size="24" fill="#147d72" font-weight="600" text-anchor="start">residuals(...) → physics.forward(...)</text>
<text x="547" y="424" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">PhysicsInformer가 ODE 잔차 계산.</text>
<text x="547" y="453" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">x_tt / y_tt를 받으며 시간을 스스로 추론하지 않음.</text>
<text x="547" y="482" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">loss_terms()에서 가속도 잔차를 9.81로 나눔.</text>
<text x="547" y="511" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">초기 조건 검사는 t = 0에서 모델 사용.</text>
<path d="M 465 438 H 525" fill="none" stroke="#526573" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 994 289 V 351" fill="none" stroke="#526573" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="38" y="588" width="537" height="172" rx="14" fill="#fff5e9" stroke="#bd6416" stroke-width="2"/>
<text x="60" y="624" font-size="24" fill="#bd6416" font-weight="600" text-anchor="start">loss_terms()</text>
<text x="60" y="661" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">physics</text>
<text x="60" y="690" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">initial_position</text>
<text x="60" y="719" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">initial_velocity</text>
<text x="60" y="748" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">이 세 스칼라 손실을 합산.</text>
<rect x="637" y="588" width="525" height="172" rx="14" fill="#f5f1fb" stroke="#7658a3" stroke-width="2"/>
<text x="659" y="624" font-size="24" fill="#7658a3" font-weight="600" text-anchor="start">optimize_projectile()</text>
<text x="659" y="661" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">zero_grad → loss.backward → step</text>
<text x="659" y="690" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">PyTorch Adam + 코사인 학습률</text>
<text x="659" y="719" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">기본값: 5,000회 갱신.</text>
<text x="659" y="748" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">매 갱신마다 신경망 가중치 변경.</text>
<path d="M 835 525 V 557 H 308 V 588" fill="none" stroke="#526573" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 575 675 H 637" fill="none" stroke="#526573" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="38" y="813" font-size="21" fill="#526573" font-weight="400" text-anchor="start">t = 0의 모델에서 위치와 속도 손실을 직접 계산하고 ODE 잔차 손실에 더함.</text>
<rect x="38" y="840" width="1124" height="67" rx="14" fill="#eef5fb" stroke="#2269a8" stroke-width="2"/>
<text x="60" y="876" font-size="24" fill="#2269a8" font-weight="600" text-anchor="start">evaluate() → 0–5초 정확도; 5–8초 외삽은 별도 보고.</text>
</g></svg>
