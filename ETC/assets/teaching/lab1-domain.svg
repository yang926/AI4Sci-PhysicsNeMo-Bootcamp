<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
<title id="title">실습 1 · 하나의 방정식, 세 가지 학습 과제</title><desc id="desc">순방향 문제와 역문제는 0부터 1까지의 구간에서 풉니다. 순방향 문제는 양 끝점을 포함한 고정 점 256개를 사용합니다. 매개변수화 학습은 1과 2 사이의 길이 17개와 길이마다 위치 32개를 사용합니다. 역문제는 해의 관측값 100개도 사용합니다. 소스항은 제공되지 않으며 학습으로 구합니다.</desc>
