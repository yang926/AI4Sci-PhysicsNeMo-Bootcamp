<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
<title id="title">Lab 1 · one equation, three learning tasks</title><desc id="desc">Forward and inverse solve on the interval zero to one. Forward uses 256 fixed points including endpoints. Parameterized training uses seventeen lengths between one and two with thirty-two positions per length. Inverse also uses one hundred solution observations; the source is learned, not supplied.</desc>
