<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
  <title id="title">Lab 4: a global weather grid and eight forecast steps</title>
  <desc id="desc">A schematic global latitude-longitude grid, not a weather prediction. The input has 26 fields on 720 by 1440 points with quarter-degree spacing. Latitude runs from 90 to minus 89.75 degrees; longitude from zero to 359.75 degrees. East Asia is a verification region, not the model's domain. Starting with ERA5 at zero hours, the same pretrained model advances all fields in six-hour steps to 48 hours.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#147d72"/></marker>
    <pattern id="grid" width="53" height="36.25" patternUnits="userSpaceOnUse"><path d="M53 0H0V36.25" fill="none" stroke="#bdd3e6" stroke-width="1.5"/></pattern>
  </defs>
  <rect width="1200" height="840" fill="#ffffff"/>
  <g font-family="DejaVu Sans, Arial, sans-serif" fill="#172c3c">
    <text x="44" y="54" font-size="32" font-weight="700">Lab 4 · Where and when does the model predict?</text>
    <text x="44" y="93" font-size="22" fill="#526573">Global weather fields in; a global weather forecast out. No sampled PINN domain.</text>
    <text x="110" y="155" font-size="24" font-weight="700" fill="#2269a8">Global latitude–longitude grid</text>
    <rect x="110" y="185" width="530" height="290" fill="#eef5fb" stroke="#2269a8" stroke-width="2"/>
    <rect x="110" y="185" width="530" height="290" fill="url(#grid)"/>
    <path d="M110 330H640" stroke="#2269a8" stroke-dasharray="6 5" stroke-width="2"/>
    <text x="92" y="192" font-size="20" text-anchor="end">90° N</text>
    <text x="92" y="337" font-size="20" text-anchor="end">0°</text>
    <text x="92" y="473" font-size="19" text-anchor="end">89.75° S</text>
    <text x="110" y="508" font-size="20">0°</text>
    <text x="375" y="508" font-size="20" text-anchor="middle">180° E</text>
    <text x="640" y="508" font-size="20" text-anchor="end">359.75° E</text>
    <rect x="257.22" y="241.39" width="88.33" height="72.5" fill="#f8dcbf" fill-opacity="0.8" stroke="#bd6416" stroke-width="3"/>
    <path d="M345.55 277H668V355H703" fill="none" stroke="#bd6416" stroke-width="2.5"/>
    <text x="715" y="189" font-size="26" font-weight="700">26 × 720 × 1440</text>
    <text x="715" y="224" font-size="22">fields × latitude × longitude</text>
    <text x="715" y="263" font-size="22" fill="#526573">0.25° spacing; south pole excluded</text>
    <text x="715" y="303" font-size="22" fill="#526573">All 26 fields advance together.</text>
    <text x="715" y="365" font-size="24" font-weight="700" fill="#bd6416">East Asia verification region</text>
    <text x="715" y="402" font-size="22">10–55° N, 100–160° E</text>
    <text x="715" y="438" font-size="22" fill="#526573">A crop for plots and error metrics,</text>
    <text x="715" y="471" font-size="22" fill="#526573">not the model's input boundary.</text>
    <text x="110" y="547" font-size="19" fill="#526573">Schematic grid; cell density is reduced for illustration.</text>
    <text x="44" y="606" font-size="25" font-weight="700">One initialization → eight six-hour predictions</text>
    <path d="M94 663H1100" stroke="#147d72" stroke-width="3" marker-end="url(#arrow)"/>
    <g stroke-width="3">
      <circle cx="100" cy="663" r="12" fill="#eef5fb" stroke="#2269a8"/>
      <g fill="#eaf6f3" stroke="#147d72"><circle cx="220" cy="663" r="10"/><circle cx="340" cy="663" r="10"/><circle cx="460" cy="663" r="10"/><circle cx="580" cy="663" r="10"/><circle cx="700" cy="663" r="10"/><circle cx="820" cy="663" r="10"/><circle cx="940" cy="663" r="10"/><circle cx="1060" cy="663" r="10"/></g>
    </g>
    <g font-size="22" text-anchor="middle"><text x="100" y="706">0 h</text><text x="220" y="706">+6 h</text><text x="340" y="706">+12 h</text><text x="460" y="706">+18 h</text><text x="580" y="706">+24 h</text><text x="700" y="706">+30 h</text><text x="820" y="706">+36 h</text><text x="940" y="706">+42 h</text><text x="1060" y="706">+48 h</text></g>
    <text x="100" y="744" font-size="20" fill="#2269a8" text-anchor="middle">ERA5 input</text>
    <text x="660" y="744" font-size="22" fill="#147d72" text-anchor="middle">Each prediction becomes the next input.</text>
    <text x="44" y="807" font-size="20" fill="#526573">Grid: run_forecast.py / load_initial() · Region: evaluate_weather.py / region_indices()</text>
  </g>
</svg>
