<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">파동 영역: 레벨 1·2의 정사각형, 레벨 3의 단위원 내부</title>
<desc id="desc">학습 표본 위치를 나타낸 개략도입니다. 파란 점은 내부 표본, 주황색 정사각형은 경계 표본입니다. 레벨 1과 2는 각 축이 0부터 pi인 정사각형과 0부터 2pi인 시간을 사용합니다. 레벨 3은 단위원 내부와 0부터 3인 시간을 사용합니다. 초기점은 같은 공간 영역에서 시간 0에 샘플링합니다.</desc>
