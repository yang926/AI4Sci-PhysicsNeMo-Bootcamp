<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1020" viewBox="0 0 1200 1020" role="img" aria-labelledby="title desc">
  <title id="title">Lab 4: actual pretrained FourCastNet inference and verification flow</title>
  <desc id="desc">The notebook runs run_forecast.py. load_initial reads only initial ERA5 data and load_model restores a pinned PhysicsNeMo AFNO checkpoint and its saved normalization. Under torch.inference_mode, each of eight passes normalizes the current physical state, applies AFNO, then restores physical units. All 26 predicted fields are fed to the next pass. Four fields are saved in forecast.npz. A separate evaluator compares this file with truth.npz and with persistence. Future ERA5 never enters the forecast model. Model weights remain fixed; no backward pass, PINN residual or optimizer is used.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#526573"/></marker><marker id="loop" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#147d72"/></marker></defs>
  <rect width="1200" height="1020" fill="#ffffff"/>
  <g font-family="DejaVu Sans, Arial, sans-serif" fill="#172c3c">
    <text x="44" y="54" font-size="32" font-weight="700">Lab 4 · Follow the forecast through the code</text>
    <text x="44" y="94" font-size="22" fill="#526573">Notebook run_script() → run_forecast.py / main()</text>
    <rect x="44" y="129" width="400" height="113" rx="12" fill="#eef5fb" stroke="#2269a8" stroke-width="2"/>
    <text x="64" y="163" font-size="24" font-weight="700" fill="#2269a8">load_initial(initial.npz)</text>
    <text x="64" y="198" font-size="22">Only the initial ERA5 state</text>
    <text x="64" y="229" font-size="20" fill="#526573">26 fields · physical units · FP32</text>
    <rect x="575" y="129" width="580" height="113" rx="12" fill="#f2eef8" stroke="#7658a3" stroke-width="2"/>
    <text x="597" y="163" font-size="24" font-weight="700" fill="#7658a3">load_model(model_dir, device)</text>
    <text x="597" y="198" font-size="22">AFNO.from_checkpoint(...).eval()</text>
    <text x="597" y="229" font-size="20" fill="#526573">Pinned weights + saved training mean and std</text>
    <path d="M155 242V319M715 242V319" fill="none" stroke="#526573" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="44" y="275" width="478" height="32" fill="#ffffff"/>
    <text x="44" y="299" font-size="22" font-weight="700">torch.inference_mode() · eight passes</text>
    <g stroke-width="2">
      <rect x="44" y="327" width="215" height="130" rx="12" fill="#eef5fb" stroke="#2269a8"/>
      <rect x="300" y="327" width="245" height="130" rx="12" fill="#f2eef8" stroke="#7658a3"/>
      <rect x="586" y="327" width="250" height="130" rx="12" fill="#eaf6f3" stroke="#147d72"/>
      <rect x="877" y="327" width="278" height="130" rx="12" fill="#f2eef8" stroke="#7658a3"/>
    </g>
    <text x="64" y="365" font-size="23" font-weight="700">Current state</text><text x="64" y="401" font-size="22">26 global fields</text><text x="64" y="436" font-size="20" fill="#526573">Physical units</text>
    <text x="320" y="365" font-size="23" font-weight="700">Normalize</text><text x="320" y="401" font-size="22">(current − mean)</text><text x="320" y="436" font-size="22">/ std</text>
    <text x="606" y="365" font-size="23" font-weight="700" fill="#147d72">PhysicsNeMo</text><text x="606" y="401" font-size="22">AFNO model(...)</text><text x="606" y="436" font-size="20" fill="#526573">Field-to-field map</text>
    <text x="897" y="365" font-size="23" font-weight="700">Restore units</text><text x="897" y="401" font-size="22">output × std + mean</text><text x="897" y="436" font-size="20" fill="#526573">Next state at +6 h</text>
    <g fill="none" stroke="#526573" stroke-width="2.5"><path d="M259 390H293" marker-end="url(#arrow)"/><path d="M545 390H579" marker-end="url(#arrow)"/><path d="M836 390H870" marker-end="url(#arrow)"/></g>
    <path d="M1017 457V516H155V464" fill="none" stroke="#147d72" stroke-width="3" marker-end="url(#loop)"/>
    <rect x="278" y="498" width="625" height="38" fill="#ffffff"/>
    <text x="590" y="524" font-size="22" fill="#147d72" text-anchor="middle">Feed all 26 predictions back in. Weights stay fixed.</text>
    <path d="M1017 516V584H832" fill="none" stroke="#526573" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="44" y="552" width="773" height="112" rx="12" fill="#eef5fb" stroke="#2269a8" stroke-width="2"/>
    <text x="64" y="589" font-size="24" font-weight="700">forecast.npz</text>
    <text x="64" y="624" font-size="22">Save u10m, v10m, msl, t2m at 0, 6, …, 48 h.</text>
    <text x="64" y="653" font-size="20" fill="#526573">Four inspection fields, not the full 26-field recurrent state</text>
    <path d="M430 664V724" fill="none" stroke="#526573" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="870" y="628" width="285" height="133" rx="12" fill="#fff4e8" stroke="#bd6416" stroke-width="2"/>
    <text x="890" y="665" font-size="24" font-weight="700" fill="#bd6416">truth.npz</text><text x="890" y="703" font-size="22">Separate ERA5 fields</text><text x="890" y="738" font-size="20" fill="#526573">Verification only</text>
    <path d="M1012 761V800H833" fill="none" stroke="#bd6416" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="44" y="733" width="773" height="167" rx="12" fill="#f5f7f9" stroke="#526573" stroke-width="2"/>
    <text x="64" y="770" font-size="24" font-weight="700">evaluate_weather.py</text>
    <text x="64" y="807" font-size="22">load_pair() → evaluate() → plot_maps() / save_gif()</text>
    <text x="64" y="844" font-size="22">Compare forecast with ERA5 and unchanged-initial persistence.</text>
    <text x="64" y="880" font-size="20" fill="#526573">Area-weighted RMSE; positive leads only; global + East Asia</text>
    <rect x="44" y="926" width="1111" height="60" rx="10" fill="#eaf6f3"/>
    <text x="600" y="965" font-size="23" font-weight="700" fill="#147d72" text-anchor="middle">Inference, not training: no optimizer, backward pass or PINN residual.</text>
  </g>
</svg>
