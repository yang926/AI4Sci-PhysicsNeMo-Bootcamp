<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="995" viewBox="0 0 1200 995" role="img" aria-labelledby="title desc">
<title id="title">챌린지 4 · 생성 함수, 장 손실, PINO</title>
<desc id="desc">operator_training.run은 학생이 작성한 데이터셋·모델 생성 함수를 호출합니다. 데이터 손실은 정규화된 장을 비교합니다. 레벨 3은 정규화를 되돌린 장에 스펙트럼 PhysicsInformer를 적용하여 학생의 PDE를 추가하고 잔차의 척도를 조정합니다. 두 손실 분기는 같은 FNO 모델을 갱신합니다.</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
<path d="M0,0 L8,4 L0,8Z" fill="#526573"/>
</marker>
</defs>
<rect width="1200" height="995" fill="#ffffff"/>
<g font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, Apple SD Gothic Neo, DejaVu Sans, Arial, sans-serif">
<text x="40" y="52" font-size="34" fill="#172c3c" text-anchor="start" font-weight="650">챌린지 4 · 생성 함수, 장 손실, PINO</text>
<text x="40" y="91" font-size="24" fill="#526573" text-anchor="start" font-weight="400">레벨 3(PINO)에서는 같은 FNO 가중치에 두 기울기가 모두 전달됩니다.</text>
<rect x="40" y="131" width="350" height="156" rx="14" fill="#eef5fc" stroke="#2269a8" stroke-width="2"/>
<text x="60" y="167" font-size="25" fill="#2269a8" text-anchor="start" font-weight="600">학습 데이터</text>
<text x="60" y="203" font-size="21" fill="#172c3c" text-anchor="start" font-weight="400">load_data → 학습 분할 통계</text>
<text x="60" y="235" font-size="21" fill="#172c3c" text-anchor="start" font-weight="400">세 분할 모두 정규화</text>
<text x="60" y="267" font-size="21" fill="#172c3c" text-anchor="start" font-weight="400">학습 / 검증 / 테스트 분리</text>
<rect x="425" y="131" width="350" height="156" rx="14" fill="#fff3e6" stroke="#bd6416" stroke-width="2"/>
<text x="445" y="167" font-size="25" fill="#bd6416" text-anchor="start" font-weight="600">build_datasets</text>
<text x="445" y="203" font-size="21" fill="#172c3c" text-anchor="start" font-weight="400">생성 함수 → TensorDataset</text>
<text x="445" y="235" font-size="21" fill="#172c3c" text-anchor="start" font-weight="400">checked_datasets → 로더</text>
<text x="445" y="267" font-size="21" fill="#172c3c" text-anchor="start" font-weight="400">이미 정규화된 쌍</text>
<rect x="815" y="131" width="345" height="156" rx="14" fill="#fff3e6" stroke="#bd6416" stroke-width="2"/>
<text x="835" y="167" font-size="25" fill="#bd6416" text-anchor="start" font-weight="600">build_model</text>
<text x="835" y="203" font-size="21" fill="#172c3c" text-anchor="start" font-weight="400">직접 작성한 PhysicsNeMo 모델</text>
<text x="835" y="235" font-size="21" fill="#172c3c" text-anchor="start" font-weight="400">레벨 1·3: FNO    레벨 2: AFNO</text>
<text x="835" y="267" font-size="21" fill="#172c3c" text-anchor="start" font-weight="400">predict_field → 정규화된 u</text>
<path d="M390 208H422" fill="none" stroke="#526573" stroke-width="3"  marker-end="url(#arrow)"/>
<path d="M775 208H812" fill="none" stroke="#526573" stroke-width="3"  marker-end="url(#arrow)"/>
<rect x="815" y="356" width="345" height="132" rx="14" fill="#eef5fc" stroke="#2269a8" stroke-width="2"/>
<text x="835" y="392" font-size="25" fill="#2269a8" text-anchor="start" font-weight="600">데이터 손실: 모든 레벨</text>
<text x="835" y="428" font-size="21" fill="#172c3c" text-anchor="start" font-weight="400">정규화된 u를</text>
<text x="835" y="460" font-size="21" fill="#172c3c" text-anchor="start" font-weight="400">정규화된 목표값과 비교</text>
<path d="M987 287V353" fill="none" stroke="#526573" stroke-width="3"  marker-end="url(#arrow)"/>
<rect x="40" y="356" width="350" height="132" rx="14" fill="#fff3e6" stroke="#bd6416" stroke-width="2"/>
<text x="60" y="392" font-size="25" fill="#bd6416" text-anchor="start" font-weight="600">레벨 3 전용</text>
<text x="60" y="428" font-size="21" fill="#172c3c" text-anchor="start" font-weight="400">ReactionDiffusionPDE</text>
<text x="60" y="460" font-size="21" fill="#172c3c" text-anchor="start" font-weight="400">직접 작성한 self.equations</text>
<rect x="425" y="356" width="350" height="132" rx="14" fill="#edf8f5" stroke="#147d72" stroke-width="2"/>
<text x="445" y="392" font-size="25" fill="#147d72" text-anchor="start" font-weight="600">build_physics</text>
<text x="445" y="428" font-size="21" fill="#172c3c" text-anchor="start" font-weight="400">PhysicsNeMo PhysicsInformer</text>
<text x="445" y="460" font-size="21" fill="#172c3c" text-anchor="start" font-weight="400">grad_method = spectral</text>
<path d="M390 424H422" fill="none" stroke="#526573" stroke-width="3"  marker-end="url(#arrow)"/>
<rect x="425" y="558" width="350" height="155" rx="14" fill="#edf8f5" stroke="#147d72" stroke-width="2"/>
<text x="445" y="594" font-size="25" fill="#147d72" text-anchor="start" font-weight="600">physics_residual</text>
<text x="445" y="630" font-size="21" fill="#172c3c" text-anchor="start" font-weight="400">BatchedPhysicsInformer</text>
<text x="445" y="662" font-size="21" fill="#172c3c" text-anchor="start" font-weight="400">표본 하나씩 평가</text>
<text x="445" y="694" font-size="21" fill="#172c3c" text-anchor="start" font-weight="400">물리 단위의 u, f → 잔차</text>
<path d="M600 488V555" fill="none" stroke="#526573" stroke-width="3"  marker-end="url(#arrow)"/>
<rect x="40" y="558" width="350" height="155" rx="14" fill="#eef5fc" stroke="#2269a8" stroke-width="2"/>
<text x="60" y="594" font-size="25" fill="#2269a8" text-anchor="start" font-weight="600">물리 단위 복원</text>
<text x="60" y="630" font-size="21" fill="#172c3c" text-anchor="start" font-weight="400">예측 u와 입력 외력 f의</text>
<text x="60" y="662" font-size="21" fill="#172c3c" text-anchor="start" font-weight="400">정규화를 되돌린 뒤</text>
<text x="60" y="694" font-size="21" fill="#172c3c" text-anchor="start" font-weight="400">PDE 평가</text>
<path d="M985 287V314H15V637H38" fill="none" stroke="#526573" stroke-width="3"  marker-end="url(#arrow)"/>
<path d="M390 637H422" fill="none" stroke="#526573" stroke-width="3"  marker-end="url(#arrow)"/>
<rect x="815" y="558" width="345" height="155" rx="14" fill="#eef5fc" stroke="#2269a8" stroke-width="2"/>
<text x="835" y="594" font-size="25" fill="#2269a8" text-anchor="start" font-weight="600">물리 손실: 레벨 3 전용</text>
<text x="835" y="630" font-size="21" fill="#172c3c" text-anchor="start" font-weight="400">f_std로 잔차 척도 조정</text>
<text x="835" y="662" font-size="21" fill="#172c3c" text-anchor="start" font-weight="400">그다음 제곱값의 평균 계산</text>
<text x="835" y="694" font-size="21" fill="#172c3c" text-anchor="start" font-weight="400">좌표 autograd 사용 안 함</text>
<path d="M775 637H812" fill="none" stroke="#526573" stroke-width="3"  marker-end="url(#arrow)"/>
<rect x="425" y="783" width="735" height="132" rx="14" fill="#f5f1fb" stroke="#7658a3" stroke-width="2"/>
<text x="445" y="819" font-size="25" fill="#7658a3" text-anchor="start" font-weight="600">data_loss + physics_weight × physics_loss</text>
<text x="445" y="855" font-size="21" fill="#172c3c" text-anchor="start" font-weight="400">PyTorch: zero_grad → loss.backward → Adam.step</text>
<text x="445" y="887" font-size="21" fill="#172c3c" text-anchor="start" font-weight="400">레벨 1·2: physics_loss = 0. 데이터 손실 분기만 활성화.</text>
<path d="M985 713V780" fill="none" stroke="#526573" stroke-width="3"  marker-end="url(#arrow)"/>
<path d="M1160 423H1182V850H1162" fill="none" stroke="#526573" stroke-width="3"  marker-end="url(#arrow)"/>
<text x="40" y="962" font-size="21" fill="#526573" text-anchor="start" font-weight="400">공통 학습기는 정규화, 단위, 배치, 갱신을 관리하며 직접 작성한 생성 함수가 여기에 연결됩니다.</text>
</g>
</svg>
