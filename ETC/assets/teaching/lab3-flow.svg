<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1010" viewBox="0 0 1200 1010" role="img" aria-labelledby="title desc">
<title id="title">실습 3 · 두 장을 학습하고 저장한 모델 재사용</title><desc id="desc">위치와 열전도율을 CompositeBar 안의 두 PhysicsNeMo FullyConnected 신경망에 입력합니다. 별도의 Diffusion PDE가 왼쪽과 오른쪽 장을 평가하고 DiffusionInterface가 x = 1에서 온도와 열유속 차이를 평가합니다. PhysicsInformer 객체 세 개가 이 잔차들을 계산합니다. 손실을 사용하여 Adam, 이어서 L-BFGS로 두 신경망을 갱신합니다. 저장된 가중치를 불러오면 추가 학습 없이 새로운 열전도율에 적용할 수 있습니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526573"/></marker></defs><rect width="1200" height="1010" fill="#ffffff"/><g font-family="DejaVu Sans, Arial, Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<text x="38" y="48" font-size="30" fill="#172c3c" font-weight="600" text-anchor="start">실습 3 · 두 장을 학습하고 저장한 모델 재사용</text><text x="38" y="85" font-size="19" fill="#526573" font-weight="400" text-anchor="start">코드 연결도 · 학습 결과가 아닌 개략도</text>
<rect x="38" y="116" width="333" height="173" rx="14" fill="#eef5fb" stroke="#2269a8" stroke-width="2"/>
<text x="60" y="152" font-size="24" fill="#2269a8" font-weight="600" text-anchor="start">loss_terms(): 입력</text>
<text x="60" y="189" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">x_l, x_r 및 x_i = 1</text>
<text x="60" y="218" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">D₁ = 10 또는 D₁ ∈ [5, 25].</text>
<text x="60" y="247" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">고정 또는 매개변수화 실행.</text>
<rect x="425" y="116" width="737" height="173" rx="14" fill="#edf8f5" stroke="#147d72" stroke-width="2"/>
<text x="447" y="152" font-size="24" fill="#147d72" font-weight="600" text-anchor="start">CompositeBar.forward → 왼쪽 / 오른쪽 신경망</text>
<text x="447" y="189" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">각 mlp()는 PhysicsNeMo FullyConnected 신경망.</text>
<text x="447" y="218" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">출력 변환으로 두 끝점 온도를 정확히 강제.</text>
<text x="447" y="247" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">매개변수화 입력: x와 정규화한 저항비 D₂ / D₁.</text>
<path d="M 371 205 H 425" fill="none" stroke="#526573" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="38" y="348" width="485" height="173" rx="14" fill="#fff5e9" stroke="#bd6416" stroke-width="2"/>
<text x="60" y="384" font-size="24" fill="#bd6416" font-weight="600" text-anchor="start">PDE 객체에 방정식 저장</text>
<text x="60" y="421" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">Diffusion(field='u_1', conductivity='D1')</text>
<text x="60" y="450" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">Diffusion(field='u_2', conductivity=D2)</text>
<text x="60" y="479" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">DiffusionInterface(): 온도 / 열유속</text>
<text x="60" y="508" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">이 PDE 객체들은 신경망 층이 아님.</text>
<rect x="580" y="348" width="582" height="173" rx="14" fill="#edf8f5" stroke="#147d72" stroke-width="2"/>
<text x="602" y="384" font-size="24" fill="#147d72" font-weight="600" text-anchor="start">PhysicsInformer 객체 세 개</text>
<text x="602" y="421" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">physics[0]: 왼쪽 확산 잔차</text>
<text x="602" y="450" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">physics[1]: 오른쪽 확산 잔차</text>
<text x="602" y="479" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">physics[2]: 계면 온도 / 열유속</text>
<text x="602" y="508" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">모두 예측한 장을 x에 대해 미분.</text>
<path d="M 523 435 H 580" fill="none" stroke="#526573" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 935 289 V 348" fill="none" stroke="#526573" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="38" y="582" width="568" height="174" rx="14" fill="#fff5e9" stroke="#bd6416" stroke-width="2"/>
<text x="60" y="618" font-size="24" fill="#bd6416" font-weight="600" text-anchor="start">loss_terms()</text>
<text x="60" y="655" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">physics + interface_temperature</text>
<text x="60" y="684" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">                + interface_flux + boundary</text>
<text x="60" y="713" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">끝점 변환으로 경계 손실이 0이 됨.</text>
<text x="60" y="742" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">계면 값은 여전히 학습.</text>
<rect x="666" y="582" width="496" height="174" rx="14" fill="#f5f1fb" stroke="#7658a3" stroke-width="2"/>
<text x="688" y="618" font-size="24" fill="#7658a3" font-weight="600" text-anchor="start">optimize_lab()</text>
<text x="688" y="655" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">Adam 200회 호출: 무작위 배치</text>
<text x="688" y="684" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">L-BFGS 100회 호출: 고정 점</text>
<text x="688" y="713" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">두 신경망 모두 기울기로 갱신.</text>
<text x="688" y="742" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">L-BFGS는 호출마다 closure 반복 가능.</text>
<path d="M 860 521 V 552 H 317 V 582" fill="none" stroke="#526573" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 606 669 H 666" fill="none" stroke="#526573" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="38" y="819" width="302" height="149" rx="14" fill="#eef5fb" stroke="#2269a8" stroke-width="2"/>
<text x="60" y="855" font-size="24" fill="#2269a8" font-weight="600" text-anchor="start">save_run()</text>
<text x="60" y="892" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">model.pt와</text>
<text x="60" y="921" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">학습 결과 저장.</text>
<rect x="390" y="819" width="410" height="149" rx="14" fill="#eef5fb" stroke="#2269a8" stroke-width="2"/>
<text x="412" y="855" font-size="24" fill="#2269a8" font-weight="600" text-anchor="start">load_checkpoint()</text>
<text x="412" y="892" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">infer_checkpoint(..., dvals)</text>
<text x="412" y="921" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">매개변수화 모델 다시 불러오기.</text>
<text x="412" y="950" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">[5, 25] 안의 새 D₁ 선택.</text>
<rect x="850" y="819" width="312" height="149" rx="14" fill="#eef5fb" stroke="#2269a8" stroke-width="2"/>
<text x="872" y="855" font-size="24" fill="#2269a8" font-weight="600" text-anchor="start">material_fields()</text>
<text x="872" y="892" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">온도 + 열유속</text>
<text x="872" y="921" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">최적화기 호출 없음.</text>
<text x="872" y="950" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">재학습 없음.</text>
<path d="M 340 893 H 390" fill="none" stroke="#526573" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 800 893 H 850" fill="none" stroke="#526573" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 980 756 V 789 H 187 V 819" fill="none" stroke="#526573" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="38" y="998" font-size="21" fill="#526573" font-weight="400" text-anchor="start">x = 1의 양쪽 확인. 온도가 일치해도 열유속이 일치한다고 할 수는 없음.</text></g></svg>
