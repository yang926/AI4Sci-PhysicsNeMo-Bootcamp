<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1070" viewBox="0 0 1200 1070" role="img" aria-labelledby="title desc">
<title id="title">파동 연습 함수와 신경망 예측이 손실에서 연결되는 과정</title>
<desc id="desc">신경망은 x, y, t를 변위로 사상합니다. 이와 별도로 student_speed와 student_equations는 WaveEquation2D PDE 객체를 구성하고, create_informer는 그 객체로 PhysicsInformer를 만듭니다. residuals는 공간·시간 도함수로 신경망 예측에 방정식을 적용하여 평가합니다. student_conditions는 conditions와 condition_tensor를 거쳐 초기·경계 손실로 이어집니다. 이 손실들과 PDE 손실을 합산한 뒤 backward와 Adam으로 신경망 가중치만 갱신합니다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#526573"/></marker></defs>
<rect width="1200" height="1070" fill="#ffffff"/>
<g font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, Apple SD Gothic Neo, DejaVu Sans, Arial, sans-serif" fill="#172c3c">
<text x="36" y="46" font-size="30" font-weight="bold">작성한 방정식은 신경망 층이 아닙니다</text>
<text x="36" y="83" font-size="22" fill="#526573">손실이 예측장을 평가할 때 서로 다른 두 객체가 연결됩니다.</text>
<text x="36" y="126" font-size="22" fill="#147d72">신경망: 제공된 모델, 학습 가능한 가중치</text>
<rect x="36" y="147" width="238" height="97" rx="8" fill="#edf5fb"/>
<text x="56" y="183" font-size="24" font-weight="bold">샘플링된 (x, y, t)</text><text x="56" y="220" font-size="22">spatial_sample()</text>
<rect x="343" y="147" width="426" height="97" rx="8" fill="#eef6f4"/>
<text x="363" y="183" font-size="24" font-weight="bold">create_model(3, 1, ...)</text><text x="363" y="220" font-size="22">PhysicsNeMo FullyConnected</text>
<rect x="838" y="147" width="326" height="97" rx="8" fill="#edf5fb"/>
<text x="858" y="183" font-size="23" font-weight="bold">예측 변위</text><text x="858" y="220" font-size="22">uθ = model(x, y, t)</text>
<g stroke="#526573" stroke-width="2" fill="none" marker-end="url(#arrow)">
<path marker-end="url(#arrow)" d="M274 195H337"/><path marker-end="url(#arrow)" d="M769 195H832"/>
<path marker-end="url(#arrow)" d="M1164 195H1184V550H1166"/>
<path marker-end="url(#arrow)" d="M998 244V277H15V689H34"/></g>
<text x="36" y="317" font-size="22" fill="#bd6416">PDE: 직접 작성한 기호적 문제 정의</text>
<rect x="36" y="337" width="270" height="104" rx="8" fill="#fff3e7"/>
<text x="56" y="375" font-size="24" font-weight="bold">student_speed</text><text x="56" y="414" font-size="22">지정된 속도장</text>
<rect x="364" y="337" width="306" height="104" rx="8" fill="#fff3e7"/>
<text x="384" y="375" font-size="24" font-weight="bold">student_equations</text><text x="384" y="414" font-size="22">SymPy 잔차 딕셔너리</text>
<rect x="728" y="337" width="436" height="104" rx="8" fill="#eef6f4"/>
<text x="748" y="375" font-size="24" font-weight="bold">WaveEquation2D(PDE)</text><text x="748" y="414" font-size="22">작성한 식 → self.equations</text>
<g stroke="#526573" stroke-width="2" fill="none" marker-end="url(#arrow)">
<path marker-end="url(#arrow)" d="M306 389H358"/><path marker-end="url(#arrow)" d="M670 389H722"/><path marker-end="url(#arrow)" d="M943 441V492"/></g>
<rect x="630" y="495" width="534" height="131" rx="8" fill="#eef6f4"/>
<text x="650" y="531" font-size="23" font-weight="bold">create_informer → PhysicsInformer</text>
<text x="650" y="568" font-size="22">residuals(...): 예측 uθ에서 평가</text>
<text x="650" y="605" font-size="22">공간 자동미분 + 제공된 u__t, u__t__t</text>
<rect x="36" y="495" width="500" height="90" rx="8" fill="#fff3e7"/>
<text x="56" y="532" font-size="24" font-weight="bold">student_conditions</text><text x="56" y="567" font-size="22">초기값과 경계 식</text>
<g stroke="#526573" stroke-width="2" fill="none" marker-end="url(#arrow)">
<path marker-end="url(#arrow)" d="M284 585V619"/><path marker-end="url(#arrow)" d="M895 626V663"/></g>
<rect x="36" y="622" width="500" height="124" rx="8" fill="#f4eff9"/>
<text x="56" y="658" font-size="24" font-weight="bold">conditions() → condition_tensor()</text>
<text x="56" y="695" font-size="22">신경망 예측값으로 평가</text>
<text x="56" y="731" font-size="22">초기: t = 0; 경계: boundary=True</text>
<rect x="630" y="666" width="534" height="80" rx="8" fill="#edf5fb"/>
<text x="650" y="700" font-size="24" font-weight="bold">PDE 손실</text><text x="650" y="731" font-size="22">수치 잔차 제곱의 평균</text>
<g stroke="#526573" stroke-width="2" fill="none" marker-end="url(#arrow)">
<path d="M284 746V758" marker-end="none"/><path marker-end="url(#arrow)" d="M284 793V811"/>
<path d="M895 746V758" marker-end="none"/><path marker-end="url(#arrow)" d="M895 793V811"/></g>
<text x="49" y="786" font-size="22">초기 변위 + 속도 + 경계</text>
<text x="760" y="786" font-size="22">PDE 잔차</text>
<rect x="36" y="815" width="1128" height="83" rx="8" fill="#f1f5f8"/>
<text x="60" y="850" font-size="25" font-weight="bold">loss_terms() → 네 손실 → record_step() → total</text>
<text x="60" y="882" font-size="22">모델은 이 수치 오차를 통해 작성한 문제를 학습합니다.</text>
<path d="M600 898V932" fill="none" stroke="#526573" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="188" y="936" width="824" height="79" rx="8" fill="#f4eff9"/>
<text x="210" y="969" font-size="24" font-weight="bold">total.backward() → optimizer.step() → 다음 학습 스텝</text>
<text x="210" y="1002" font-size="22">PyTorch Adam은 Python 정의가 아닌 가중치를 갱신합니다.</text>
<text x="36" y="1050" font-size="20" fill="#526573">주황: 작성한 정의 · 청록: PhysicsNeMo · 보라: PyTorch / 텐서 평가 · 화살표: 데이터 또는 구성</text>
</g></svg>
