<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="770" viewBox="0 0 1200 770" role="img" aria-labelledby="title desc">
<title id="title">실습 3 · 두 재료와 하나의 공통 계면</title><desc id="desc">막대는 0부터 2까지이며 1에 재료 계면이 있습니다. 왼쪽 열전도율은 고정 실행에서 10, 매개변수화 실행에서 5부터 25 사이입니다. 오른쪽 열전도율은 0.1로 고정됩니다. 끝점 온도는 0과 100으로 고정됩니다. 두 신경망이 온도장을 학습하며 계면에서 온도와 열유속이 일치해야 합니다. 정상 문제이므로 시간 입력이 없습니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526573"/></marker></defs><rect width="1200" height="770" fill="#ffffff"/><g font-family="DejaVu Sans, Arial, Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<text x="38" y="48" font-size="30" fill="#172c3c" font-weight="600" text-anchor="start">실습 3 · 두 재료와 하나의 공통 계면</text><text x="38" y="85" font-size="19" fill="#526573" font-weight="400" text-anchor="start">코드 연결도 · 학습 결과가 아닌 개략도</text>
<text x="40" y="145" font-size="25" fill="#172c3c" font-weight="600" text-anchor="start">물리적 영역: 0 ≤ x ≤ 2; 계면 위치 x = 1</text>
<rect x="120" y="200" width="475" height="120" fill="#eef5fb" stroke="#2269a8" stroke-width="3"/><rect x="595" y="200" width="475" height="120" fill="#fff5e9" stroke="#bd6416" stroke-width="3"/>
<text x="357" y="249" font-size="26" fill="#2269a8" font-weight="600" text-anchor="middle">재료 1: D₁ = 10</text>
<text x="357" y="292" font-size="22" fill="#172c3c" font-weight="400" text-anchor="middle">학습한 온도 u₁(x)</text>
<text x="832" y="249" font-size="26" fill="#bd6416" font-weight="600" text-anchor="middle">재료 2: D₂ = 0.1</text>
<text x="832" y="292" font-size="22" fill="#172c3c" font-weight="400" text-anchor="middle">학습한 온도 u₂(x)</text>
<text x="120" y="178" font-size="24" fill="#2269a8" font-weight="600" text-anchor="middle">T(0) = 0</text>
<text x="1070" y="178" font-size="24" fill="#bd6416" font-weight="600" text-anchor="middle">T(2) = 100</text>
