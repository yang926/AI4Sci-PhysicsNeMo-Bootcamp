<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="770" viewBox="0 0 1200 770" role="img" aria-labelledby="title desc">
<title id="title">Lab 3 · two materials and one shared interface</title><desc id="desc">The bar covers zero to two with a material interface at one. The left conductivity is ten for the fixed run, or ranges from five to twenty five for the parameterized run. The right conductivity is fixed at 0.1. Endpoint temperatures are fixed at zero and one hundred. Two networks learn the fields, and their temperature and heat flux must match at the interface. The problem is steady and has no time input.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526573"/></marker></defs><rect width="1200" height="770" fill="#ffffff"/><g font-family="DejaVu Sans, Arial, sans-serif">
<text x="38" y="48" font-size="30" fill="#172c3c" font-weight="600" text-anchor="start">Lab 3 · two materials and one shared interface</text><text x="38" y="85" font-size="19" fill="#526573" font-weight="400" text-anchor="start">Code map · schematic, not a training result</text>
<text x="40" y="145" font-size="25" fill="#172c3c" font-weight="600" text-anchor="start">Physical domain: 0 ≤ x ≤ 2; interface at x = 1</text>
<rect x="120" y="200" width="475" height="120" fill="#eef5fb" stroke="#2269a8" stroke-width="3"/><rect x="595" y="200" width="475" height="120" fill="#fff5e9" stroke="#bd6416" stroke-width="3"/>
<text x="357" y="249" font-size="26" fill="#2269a8" font-weight="600" text-anchor="middle">Material 1: D₁ = 10</text>
<text x="357" y="292" font-size="22" fill="#172c3c" font-weight="400" text-anchor="middle">learned temperature u₁(x)</text>
<text x="832" y="249" font-size="26" fill="#bd6416" font-weight="600" text-anchor="middle">Material 2: D₂ = 0.1</text>
<text x="832" y="292" font-size="22" fill="#172c3c" font-weight="400" text-anchor="middle">learned temperature u₂(x)</text>
<text x="120" y="178" font-size="24" fill="#2269a8" font-weight="600" text-anchor="middle">T(0) = 0</text>
<text x="1070" y="178" font-size="24" fill="#bd6416" font-weight="600" text-anchor="middle">T(2) = 100</text>
