<line x1="595" y1="183" x2="595" y2="364" stroke="#172c3c" stroke-width="3" stroke-dasharray="5 4"/>
<text x="120" y="375" font-size="22" fill="#172c3c" font-weight="400" text-anchor="start">x = 0</text>
<text x="595" y="398" font-size="22" fill="#172c3c" font-weight="400" text-anchor="middle">x = 1</text>
<text x="1070" y="375" font-size="22" fill="#172c3c" font-weight="400" text-anchor="end">x = 2</text>
<rect x="38" y="431" width="552" height="157" rx="14" fill="#eef5fb" stroke="#2269a8" stroke-width="2"/>
<text x="60" y="467" font-size="24" fill="#2269a8" font-weight="600" text-anchor="start">각 재료 내부</text>
<text x="60" y="504" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">왼쪽 점: x_l ∈ [0, 1]</text>
<text x="60" y="537" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">오른쪽 점: x_r = 1 + x_l</text>
<text x="60" y="570" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">정상 문제: 시간 입력 없음.</text>
<rect x="626" y="431" width="536" height="157" rx="14" fill="#edf8f5" stroke="#147d72" stroke-width="2"/>
<text x="648" y="467" font-size="24" fill="#147d72" font-weight="600" text-anchor="start">계면에서: x_i = 1</text>
<text x="648" y="504" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">u₁ = u₂와 D₁ u₁,x = D₂ u₂,x 학습.</text>
<text x="648" y="537" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">온도와 열유속이 각각 같음.</text>
<text x="648" y="570" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">기울기 자체는 불연속일 수 있음.</text>
<rect x="38" y="619" width="1124" height="119" rx="14" fill="#eef5fb" stroke="#2269a8" stroke-width="2"/>
<text x="60" y="655" font-size="24" fill="#2269a8" font-weight="600" text-anchor="start">매개변수화 실행: 막대 형상은 그대로, D₁ 변경</text>
<text x="60" y="692" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">D₁ ∈ [5, 25]; 두 신경망에 x와 정규화한 저항비 D₂ / D₁ 입력.</text>
<text x="60" y="725" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">왼쪽 경계는 0, 오른쪽 경계는 100, 계면 위치는 x = 1로 유지.</text>
<text x="38" y="765" font-size="20" fill="#526573" font-weight="400" text-anchor="start">loss_terms()에서 샘플 설정; CompositeBar.forward()는 끝점 온도만 강제.</text></g></svg>
