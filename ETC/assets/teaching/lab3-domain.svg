<text x="1070" y="375" font-size="22" fill="#172c3c" font-weight="400" text-anchor="end">x = 2</text>
<rect x="38" y="431" width="552" height="157" rx="14" fill="#eef5fb" stroke="#2269a8" stroke-width="2"/>
<text x="60" y="467" font-size="24" fill="#2269a8" font-weight="600" text-anchor="start">Inside each material</text>
<text x="60" y="504" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">left points: x_l ∈ [0, 1]</text>
<text x="60" y="537" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">right points: x_r = 1 + x_l</text>
<text x="60" y="570" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">Steady problem: no time input.</text>
<rect x="626" y="431" width="536" height="157" rx="14" fill="#edf8f5" stroke="#147d72" stroke-width="2"/>
<text x="648" y="467" font-size="24" fill="#147d72" font-weight="600" text-anchor="start">At the interface: x_i = 1</text>
<text x="648" y="504" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">Learn u₁ = u₂ and D₁ u₁,x = D₂ u₂,x.</text>
<text x="648" y="537" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">Equal temperature and equal heat flux.</text>
<text x="648" y="570" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">The slope itself may jump.</text>
<rect x="38" y="619" width="1124" height="119" rx="14" fill="#eef5fb" stroke="#2269a8" stroke-width="2"/>
<text x="60" y="655" font-size="24" fill="#2269a8" font-weight="600" text-anchor="start">Parameterized run: vary D₁, not the bar geometry</text>
<text x="60" y="692" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">D₁ ∈ [5, 25]; both networks receive x and the normalized resistance ratio D₂ / D₁.</text>
<text x="60" y="725" font-size="21" fill="#172c3c" font-weight="400" text-anchor="start">The left boundary stays at 0, the right stays at 100, and the interface stays at x = 1.</text>
<text x="38" y="765" font-size="20" fill="#526573" font-weight="400" text-anchor="start">loss_terms() sets the samples; CompositeBar.forward() imposes only the endpoint temperatures.</text></g></svg>

