<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="956" viewBox="0 0 1200 956" role="img" aria-labelledby="title desc">
<title id="title">챌린지 4 · 전체 장 사이의 사상 학습</title>
<desc id="desc">주기적 정사각형 격자 두 개는 FNO 또는 AFNO가 외력 f를 해 u로 사상하는 모습을 보여 줍니다. 입력과 출력은 배치, 단일 채널, N×N의 형태입니다. 점 64개로 된 좌표축에서 1은 제외하며 두 공간 방향은 모두 주기적으로 이어집니다.</desc>
