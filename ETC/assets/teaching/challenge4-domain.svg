<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="956" viewBox="0 0 1200 956" role="img" aria-labelledby="title desc">
<title id="title">Challenge 4 · Learn a mapping between whole fields</title>
<desc id="desc">Two schematic periodic square grids show forcing f mapped to solution u by FNO or AFNO. Input and output have batch one channel N by N shape. The sixty-four point coordinate axes exclude one; both spatial directions wrap periodically.</desc>
