<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="922" viewBox="0 0 1200 922" role="img" aria-labelledby="title desc">
<title id="title">챌린지 3 · 네 연습 함수의 네 역할</title>
<desc id="desc">매개변수는 ClimatePDE로 전달되고, 방정식은 PhysicsInformer 잔차가 되며, 조건은 별도 손실을 구성합니다. student_solution은 비교 그래프만 제공합니다. Adam이 신경망 가중치를 갱신하며 해석해 비교는 모델 학습에 사용되지 않습니다.</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
<path d="M0,0 L8,4 L0,8Z" fill="#526573"/>
</marker>
</defs>
<rect width="1200" height="922" fill="#ffffff"/>
<g font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, Apple SD Gothic Neo, DejaVu Sans, Arial, sans-serif">
<text x="40" y="52" font-size="34" fill="#172c3c" text-anchor="start" font-weight="650">챌린지 3 · 네 연습 함수의 네 역할</text>
<text x="40" y="91" font-size="24" fill="#526573" text-anchor="start" font-weight="400">물리 모델과 신경망은 서로 다른 객체입니다.</text>
<rect x="40" y="130" width="347" height="126" rx="14" fill="#fff3e6" stroke="#bd6416" stroke-width="2"/>
<text x="60" y="166" font-size="25" fill="#bd6416" text-anchor="start" font-weight="600">student_parameters</text>
<text x="60" y="202" font-size="21" fill="#172c3c" text-anchor="start" font-weight="400">physical_parameters</text>
<text x="60" y="234" font-size="21" fill="#172c3c" text-anchor="start" font-weight="400">계수 검증</text>
<rect x="425" y="130" width="350" height="126" rx="14" fill="#fff3e6" stroke="#bd6416" stroke-width="2"/>
<text x="445" y="166" font-size="25" fill="#bd6416" text-anchor="start" font-weight="600">student_equations</text>
<text x="445" y="202" font-size="21" fill="#172c3c" text-anchor="start" font-weight="400">ClimatePDE(params)</text>
<text x="445" y="234" font-size="21" fill="#172c3c" text-anchor="start" font-weight="400">→ self.equations</text>
<rect x="815" y="130" width="345" height="126" rx="14" fill="#fff3e6" stroke="#bd6416" stroke-width="2"/>
<text x="835" y="166" font-size="25" fill="#bd6416" text-anchor="start" font-weight="600">student_conditions</text>
<text x="835" y="202" font-size="21" fill="#172c3c" text-anchor="start" font-weight="400">초기·경계 목표값</text>
<text x="835" y="234" font-size="21" fill="#172c3c" text-anchor="start" font-weight="400">모든 출력장에 적용</text>
<path d="M387 194H423" fill="none" stroke="#526573" stroke-width="3"  marker-end="url(#arrow)"/>
<path d="M600 256V292" fill="none" stroke="#526573" stroke-width="3"  marker-end="url(#arrow)"/>
<path d="M987 256V511" fill="none" stroke="#526573" stroke-width="3"  marker-end="url(#arrow)"/>
<rect x="40" y="295" width="347" height="158" rx="14" fill="#edf8f5" stroke="#147d72" stroke-width="2"/>
<text x="60" y="331" font-size="25" fill="#147d72" text-anchor="start" font-weight="600">(x, y, t) 샘플링</text>
<text x="60" y="367" font-size="21" fill="#172c3c" text-anchor="start" font-weight="400">sample_square / sample_time</text>
<text x="60" y="399" font-size="20" fill="#172c3c" text-anchor="start" font-weight="400">create_model → FullyConnected</text>
<text x="60" y="431" font-size="21" fill="#172c3c" text-anchor="start" font-weight="400">레벨 1: T    레벨 2: Ta, To</text>
<rect x="425" y="295" width="350" height="158" rx="14" fill="#edf8f5" stroke="#147d72" stroke-width="2"/>
<text x="445" y="331" font-size="25" fill="#147d72" text-anchor="start" font-weight="600">create_informer</text>
<text x="445" y="367" font-size="21" fill="#172c3c" text-anchor="start" font-weight="400">PhysicsNeMo PhysicsInformer</text>
<text x="445" y="399" font-size="21" fill="#172c3c" text-anchor="start" font-weight="400">각 장의 공간 도함수와</text>
<text x="445" y="431" font-size="21" fill="#172c3c" text-anchor="start" font-weight="400">PDE 잔차</text>
<path d="M387 374H423" fill="none" stroke="#526573" stroke-width="3"  marker-end="url(#arrow)"/>
<text x="40" y="494" font-size="21" fill="#526573" text-anchor="start" font-weight="400">residuals는 모델의 장과</text>
<text x="40" y="524" font-size="21" fill="#526573" text-anchor="start" font-weight="400">PyTorch 시간 도함수를 제공합니다.</text>
<rect x="425" y="515" width="350" height="128" rx="14" fill="#eef5fc" stroke="#2269a8" stroke-width="2"/>
<text x="445" y="551" font-size="25" fill="#2269a8" text-anchor="start" font-weight="600">PDE 손실</text>
<text x="445" y="587" font-size="21" fill="#172c3c" text-anchor="start" font-weight="400">informer.forward</text>
<text x="445" y="619" font-size="21" fill="#172c3c" text-anchor="start" font-weight="400">수치 잔차의 제곱</text>
<path d="M600 453V512" fill="none" stroke="#526573" stroke-width="3"  marker-end="url(#arrow)"/>
<rect x="815" y="515" width="345" height="128" rx="14" fill="#eef5fc" stroke="#2269a8" stroke-width="2"/>
<text x="835" y="551" font-size="25" fill="#2269a8" text-anchor="start" font-weight="600">초기 / 경계 손실</text>
<text x="835" y="587" font-size="21" fill="#172c3c" text-anchor="start" font-weight="400">condition_tensor</text>
<text x="835" y="619" font-size="21" fill="#172c3c" text-anchor="start" font-weight="400">목표값과 장 비교</text>
<path d="M213 453V475H795V597H813" fill="none" stroke="#526573" stroke-width="3"  marker-end="url(#arrow)"/>
<rect x="425" y="711" width="735" height="127" rx="14" fill="#f5f1fb" stroke="#7658a3" stroke-width="2"/>
<text x="445" y="747" font-size="25" fill="#7658a3" text-anchor="start" font-weight="600">loss_terms → record_step → 전체 손실</text>
<text x="445" y="783" font-size="21" fill="#172c3c" text-anchor="start" font-weight="400">PyTorch: zero_grad → backward → Adam.step</text>
<text x="445" y="815" font-size="21" fill="#172c3c" text-anchor="start" font-weight="400">두 분기를 통해 같은 신경망을 갱신합니다.</text>
<path d="M600 643V708" fill="none" stroke="#526573" stroke-width="3"  marker-end="url(#arrow)"/>
<path d="M987 643V708" fill="none" stroke="#526573" stroke-width="3"  marker-end="url(#arrow)"/>
<rect x="40" y="590" width="347" height="248" rx="14" fill="#fff3e6" stroke="#bd6416" stroke-width="2"/>
<text x="60" y="626" font-size="25" fill="#bd6416" text-anchor="start" font-weight="600">student_solution</text>
<text x="60" y="662" font-size="21" fill="#172c3c" text-anchor="start" font-weight="400">기준 설정 비교 전용</text>
<text x="60" y="694" font-size="21" fill="#172c3c" text-anchor="start" font-weight="400">→ comparison</text>
<text x="60" y="726" font-size="21" fill="#172c3c" text-anchor="start" font-weight="400">→ reference_errors_over_time</text>
<text x="60" y="758" font-size="21" fill="#172c3c" text-anchor="start" font-weight="400">
</text>
<text x="60" y="790" font-size="21" fill="#172c3c" text-anchor="start" font-weight="400">학습 목표가 아닙니다.</text>
<text x="60" y="822" font-size="21" fill="#172c3c" text-anchor="start" font-weight="400">독립적으로 검증되지 않았습니다.</text>
<text x="40" y="888" font-size="22" fill="#526573" text-anchor="start" font-weight="400">작은 로컬 잔차는 구현 내부의 일관성을 뜻하며 정확성의 증명은 아닙니다.</text>
</g>
</svg>
